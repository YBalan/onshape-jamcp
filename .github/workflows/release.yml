name: Release

# Publishes onshape-jamcp to PyPI using Trusted Publishing (OIDC): no API token is stored anywhere.
#
#   Release  : git tag vX.Y.Z && git push --follow-tags     -> verify -> build -> PyPI -> GitHub Release
#   Dry run  : Actions -> Release -> Run workflow (target: testpypi) -> verify -> build -> TestPyPI
#
# One-time setup is described in docs/publishing.md.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (pypi needs the workflow to run on a vX.Y.Z tag)"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint, tests, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version, changelog and tag agree
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python scripts/release.py check --tag "$REF_NAME"
          else
            python scripts/release.py check
          fi
      - name: Install
        run: python -m pip install -e . pytest pytest-asyncio ruff
      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests
        run: python -m pytest -q
      - name: Docs are in sync
        run: python scripts/gen_tools_doc.py --check

  build:
    name: Build sdist + wheel
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/onshape-jamcp --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      # The Claude Desktop installer. It lives in its own folder and artifact: everything in dist/
      # goes to PyPI, which would refuse a .mcpb file.
      - name: Build the Claude Desktop bundle (.mcpb)
        run: |
          python -m pip install dist/*.whl
          python scripts/build_mcpb.py --out bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: bundle/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # a version can only be uploaded once; allow re-running the dry run

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi # add required reviewers to this environment for a manual approval gate
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: bundle/
      - name: Create or update the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py notes "${TAG#v}" > notes.md
          # onshape-jamcp.mcpb keeps one name, so .../releases/latest/download/onshape-jamcp.mcpb
          # (the README's install link) always serves the newest bundle.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* bundle/* --clobber
          else
            gh release create "$TAG" dist/* bundle/* --title "$TAG" --notes-file notes.md
          fi
